name: Build Downloadable Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Ensure Permanent Signing Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring permanent debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found, generating standard debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK and run unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} --stacktrace 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failed'
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong|> Task .* FAILED|Exception|expected:<' build.log | head -150
            echo '```'
          } > errors.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@errors.md

      - name: Verify APK Generation
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "APK successfully built! Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morph-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Artifacts are always zipped by GitHub, which is awkward on a phone. Every push to main also
      # publishes the bare .apk as a release, reachable at a fixed link:
      # https://github.com/<owner>/<repo>/releases/latest/download/Morph.apk
      - name: Publish APK as a GitHub release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Morph.apk
          # Same APK under the old name, so links shared before the rename keep working.
          cp Morph.apk OmniConvert-Studio.apk
          gh release create "build-${{ github.run_number }}" Morph.apk OmniConvert-Studio.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Morph 1.0.${{ github.run_number }}" \
            --notes "APK generato automaticamente da main (commit ${{ github.sha }}). Dal telefono tocca Morph.apk qui sotto per scaricarlo, poi aprilo per installarlo." \
            --latest

      - name: Add Job Summary
        run: |
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "### 🚀 APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: Morph" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`com.aistudio.omniconvert.kxmpzq\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`1.0.${{ github.run_number }}\` (build ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct APK (main): https://github.com/${{ github.repository }}/releases/latest/download/Morph.apk" >> $GITHUB_STEP_SUMMARY
          echo "Zipped APK: **Artifacts** section at the bottom of this run." >> $GITHUB_STEP_SUMMARY
