name: Build Downloadable Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Ensure Permanent Signing Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring permanent debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found, generating standard debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} --stacktrace

      - name: Verify APK Generation
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "APK successfully built! Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add Job Summary
        run: |
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "### 🚀 APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: OmniConvert Studio" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`com.aistudio.omniconvert.kxmpzq\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`1.0.0\` (build 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK from the **Artifacts** section at the bottom of this Actions workflow run." >> $GITHUB_STEP_SUMMARY
